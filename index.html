<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRIS Gift | Портал за подаръци и покани</title>
  
  <!-- Font from irispay.eu: Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Three.js, Helpers, and GSAP -->
  <script src="three.min.js"></script>
  <script src="RoundedBoxGeometry.js"></script>
  <script src="RoomEnvironment.js"></script>
  <script src="gsap.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Blurred Ambient Orbs (IRIS Pay Style) -->
  <div class="ambient-orbs-container" aria-hidden="true">
    <div class="ambient-orb orb-orange"></div>
    <div class="ambient-orb orb-blue"></div>
    <div class="ambient-orb orb-cyan"></div>
    <div class="ambient-orb orb-amber"></div>
  </div>

  <!-- ============================================================== -->
  <!-- SCREEN 1: Sleek Gray IRIS Gift Portal Dashboard                 -->
  <!-- ============================================================== -->
  <div class="portal-overlay" id="portalView">
    
    <!-- Portal Header -->
    <header class="portal-header">
      <div class="portal-brand">
        <img src="iris_logo.png" alt="IRIS Logo" class="brand-logo-img">
        <span class="portal-brand-title">IRIS <span class="brand-highlight">Gift</span></span>
      </div>

      <!-- The Active Notification Bell (Only clickable element) -->
      <div class="portal-notification-wrapper" id="notificationTrigger" role="button" tabindex="0" title="Виж известието">
        <div class="bell-icon-box">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bell-svg">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="bell-badge-dot"></span>
        </div>
        <div class="notification-pill">
          <span class="notification-pulse"></span>
          <span class="notification-text">Ново известие</span>
        </div>
      </div>
    </header>

    <!-- Main Portal Content -->
    <main class="portal-main">
      <div class="portal-hero">
        <span class="portal-subtitle">Управление на подаръци и специални поводи</span>
        <h1 class="portal-title">Добре дошли в IRIS Gift</h1>
      </div>

      <!-- The 3 Action Buttons (Cosmetic / Inactive as requested) -->
      <div class="portal-cards-grid">
        <div class="portal-btn-card inactive" title="Функцията е временно неактивна">
          <div class="card-icon-wrap icon-plus">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </div>
          <div class="card-text-block">
            <h3 class="card-title">Създай нова покана</h3>
            <p class="card-desc">Организирай нов персонален или екипен подарък</p>
          </div>
          <span class="card-arrow">→</span>
        </div>

        <div class="portal-btn-card inactive" title="Функцията е временно неактивна">
          <div class="card-icon-wrap icon-clock">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <div class="card-text-block">
            <h3 class="card-title">Сегашни покани</h3>
            <p class="card-desc">Преглед на активни събития и събирания</p>
          </div>
          <span class="card-arrow">→</span>
        </div>

        <div class="portal-btn-card inactive" title="Функцията е временно неактивна">
          <div class="card-icon-wrap icon-history">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8v4l3 3"></path>
              <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
            </svg>
          </div>
          <div class="card-text-block">
            <h3 class="card-title">Виж стари покани</h3>
            <p class="card-desc">Архив на минали споделени подаръци</p>
          </div>
          <span class="card-arrow">→</span>
        </div>
      </div>
    </main>

  </div> <!-- /portal-overlay -->


  <!-- ============================================================== -->
  <!-- SCREEN 2: 3D Gift Box Scene                                    -->
  <!-- ============================================================== -->
  <div class="present-view-container" id="presentView">
    
    <!-- Top Header on 3D View -->
    <header class="top-bar">
      <div class="brand-tag">
        <img src="iris_logo.png" alt="IRIS Logo" class="brand-logo-img">
        <span class="brand-text">IRIS <span class="brand-highlight">Gift</span></span>
      </div>

      <div class="header-actions">
        <button id="resetBtn" class="pill-btn highlight" style="display: none;">
          <span>Опаковай отново</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 3D WebGL Canvas Container -->
    <div id="webglContainer"></div>

  </div> <!-- /present-view-container -->


  <!-- High-Res Zoomed Card Modal (Auto-opens on unboxing) -->
  <div class="card-modal" id="cardModal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-wrapper">
      <button class="modal-close" id="modalClose" aria-label="Затвори">&times;</button>
      <img src="card.png" alt="Картичка за рождения ден на Мишо" class="modal-image">
    </div>
  </div>

  <!-- Loading Screen -->
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-spinner">
      <img src="iris_logo.png" alt="Зареждане" class="loader-logo-pulse">
    </div>
    <div class="loader-text">IRIS Gift</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
